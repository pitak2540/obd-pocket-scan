name: Build Windows EXE
on:
  push:
    branches: [main]
    paths: ['index.html', 'desktop/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build portable exe
        shell: bash
        run: |
          cp index.html desktop/index.html
          cd desktop
          npm install --no-audit --no-fund
          npx electron-builder --win portable --ia32 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: james-diagnostic-exe
          path: desktop/dist/JAMES-Diagnostic.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-${{ github.run_number }}
          name: JAMES Diagnostic Windows build ${{ github.run_number }}
          files: desktop/dist/JAMES-Diagnostic.exe
